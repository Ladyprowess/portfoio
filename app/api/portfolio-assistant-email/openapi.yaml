openapi: 3.1.0
info:
  title: Lady Prowess Portfolio Email API
  version: 1.0.0
  description: Sends and retrieves email through the portfolio's existing Resend and Supabase setup.
servers:
  - url: https://YOUR-PORTFOLIO-DOMAIN
paths:
  /api/assistant-email:
    post:
      operationId: portfolioEmail
      summary: Send, reuse, or inspect portfolio emails
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/SendEmail'
                - $ref: '#/components/schemas/ResendEmail'
                - $ref: '#/components/schemas/ListRecent'
                - $ref: '#/components/schemas/GetEmail'
      responses:
        '200':
          description: Request completed.
        '202':
          description: Resend accepted the email or delivery status needs checking.
        '400':
          description: Invalid request.
        '401':
          description: Invalid or missing API key.
        '409':
          description: Duplicate or conflicting request.
        '429':
          description: Daily sending limit reached.
        '502':
          description: Email provider rejected the message.
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    SendEmail:
      type: object
      additionalProperties: false
      required: [action, requestId, to, subject, body]
      properties:
        action: { type: string, const: send }
        requestId: { type: string, minLength: 8, maxLength: 128 }
        to: { type: string, format: email }
        subject: { type: string, maxLength: 300 }
        body: { type: string, maxLength: 20000 }
    ResendEmail:
      type: object
      additionalProperties: false
      required: [action, requestId, emailId, to]
      properties:
        action: { type: string, const: resend }
        requestId: { type: string, minLength: 8, maxLength: 128 }
        emailId: { type: string }
        to: { type: string, format: email }
        subject:
          type: string
          maxLength: 300
          description: Optional replacement subject. If omitted, the original subject is reused.
    ListRecent:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, const: list_recent }
        limit: { type: integer, minimum: 1, maximum: 20, default: 10 }
    GetEmail:
      type: object
      additionalProperties: false
      required: [action, emailId]
      properties:
        action: { type: string, const: get_email }
        emailId: { type: string }
